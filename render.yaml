services:
  - type: web
    name: fca-inspection
    runtime: node
    plan: starter
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FCA_DATA_DIR
        value: /var/data
      - key: FCA_ACCESS_USER
        value: inspector
      - key: FCA_ACCESS_PASSWORD
        generateValue: true
    disk:
      name: fca-data
      mountPath: /var/data
      sizeGB: 1
